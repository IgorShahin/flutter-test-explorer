name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # IntelliJ Platform tests dispatch real Swing events and need a headful AWT toolkit.
      - name: Ensure virtual display is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb
          fi

      - name: Test, verify and build
        run: >-
          xvfb-run
          --auto-servernum
          --server-args="-screen 0 1920x1080x24"
          ./gradlew
          --no-daemon
          --stacktrace
          --console=plain
          test
          buildPlugin
          verifyPluginStructure
          verifyPluginProjectConfiguration

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-explorer-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
